<div class="create-container">
  <div class="create-card">
    <div class="card-head">
      <div class="card-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
          <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h12zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2z"/>
          <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
        </svg>
      </div>
      <h2>สร้างคำขอสิทธิ์ใหม่ (Create Request)</h2>
    </div>

    <form (ngSubmit)="onSubmit()" class="card-body">
      
      <div class="form-group">
        <label>หัวข้อคำขอ (Title) <span class="required">*</span></label>
        <input 
          type="text" 
          class="form-input" 
          placeholder="เช่น ขอสิทธิ์เข้าใช้งาน DB Production" 
          [(ngModel)]="title" 
          name="title"
          maxlength="120"
          required 
        />
        <div class="char-count">{{ title.length }}/120</div>
      </div>

      <div class="form-group">
        <label>ประเภทคำขอ (Request Type)</label>
        <select class="form-select" [(ngModel)]="requestType" name="requestType">
          <option value="DATABASE">DATABASE</option>
          <option value="APPLICATION">APPLICATION</option>
          <option value="SERVER">SERVER</option>
        </select>
      </div>

      <div class="form-group">
        <label>ระบบเป้าหมาย (Target System) <span class="required">*</span></label>
        <input 
          type="text" 
          class="form-input" 
          placeholder="เช่น DB_PROD_01" 
          [(ngModel)]="targetSystem" 
          name="targetSystem"
          maxlength="150"
          required 
        />
        <div class="char-count">{{ targetSystem.length }}/150</div>
      </div>

      <div class="form-group">
        <label>เหตุผลความจำเป็น (Reason) <span class="required">*</span></label>
        <textarea 
          class="form-textarea" 
          rows="4" 
          placeholder="ระบุเหตุผลความจำเป็นในการขอสิทธิ์เข้าใช้งาน..." 
          [(ngModel)]="reason" 
          name="reason"
          maxlength="500"
          required
        ></textarea>
        <div class="char-count">{{ reason.length }}/500</div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-save" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">บันทึกคำขอ</span>
          <span *ngIf="isSubmitting">กำลังบันทึก...</span>
        </button>
        <a routerLink="/dashboard" class="btn-cancel">ยกเลิก</a>
      </div>

    </form>
  </div>
</div>
